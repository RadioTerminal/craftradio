# The station server's container image, ghcr.io/<owner>/craftradio-server.
#
# Pushing a tag server-vX.Y.Z builds the image for linux/amd64 and linux/arm64 (each on its
# own native runner), checks that each one runs, and publishes it as X.Y.Z, X.Y and, for a
# version without a suffix, latest. A dispatched run builds and checks both images and
# publishes nothing.
name: Server image

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/craftradio-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=craftradio-server, the public station server
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          outputs: >-
            ${{ github.event_name == 'push'
              && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.image)
              || 'type=docker' }}
          # An empty string is false in an expression, so the dry run's tag comes first.
          tags: ${{ github.event_name != 'push' && 'craftradio-server:check' || '' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Check that the image runs
        env:
          IMAGE: ${{ github.event_name == 'push' && format('{0}@{1}', steps.name.outputs.image, steps.build.outputs.digest) || 'craftradio-server:check' }}
        run: |
          docker run --rm "$IMAGE" key | grep -q '^key_hash = "sha256:'
          # A config it can't read stops it with an error, not a crash.
          if docker run --rm "$IMAGE" run --config /nowhere.toml; then
            echo "the server started without a config" >&2
            exit 1
          fi

      - name: Keep the digest
        if: github.event_name == 'push'
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Image name and version
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/craftradio-server" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.name.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.name.outputs.version }}
          flavor: |
            latest=${{ !contains(steps.name.outputs.version, '-') }}

      - name: Publish the multi-platform image
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.name.outputs.image }}@sha256:%s ' *)

      - name: Show it
        run: docker buildx imagetools inspect "${{ steps.name.outputs.image }}:${{ steps.meta.outputs.version }}"
