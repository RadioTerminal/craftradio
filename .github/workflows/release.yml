# Release pipeline, after SolidCraft's (tangency-labs/solidcraft, MIT OR Apache-2.0), which follows
# PhotoCraft's. See docs/releasing.md.
#
# Publishing a GitHub Release (or prerelease) with a tag vX.Y.Z builds every package from that tag
# and attaches them to it, SHA256SUMS.txt last, since the in-app updater reads it. The tag is the
# version. A version with a suffix (1.2.0-rc.1) is always a prerelease: the run marks it so when
# the release was not, so it never becomes "latest" and stable installs never offer it. A release
# marked prerelease stays one.
# A dispatched run is a dry run: it builds and checks every package and keeps them as the run's
# `release-assets` artifact, with no release.
#
#   macOS universal         .dmg, and the CLI as a .zip                packaging/macos/package.sh
#   Windows x64, arm64      .msi and a portable .zip                   packaging/windows/package.ps1
#   Linux x86_64, aarch64   AppImage (+ .zsync), .deb, .rpm, .tar.gz   packaging/linux/package.sh
#
# Releases ship Windows and macOS only for now. The Linux packages and the OpenPGP signature of
# SHA256SUMS.txt are off; the repository variable RELEASE_LINUX=true turns them back on.
#
# Signing is optional, as in SolidCraft: each platform signs when its secrets exist and builds
# unsigned, with a warning, when they don't. macOS: APPLE_*. Windows: WINDOWS_CERTIFICATE or the
# AZURE_* Trusted Signing values. SHA256SUMS.txt: LINUX_SIGNING_KEY. They live in the repository's
# `release` environment, which only a published release's run uses.
#
# Runners are GitHub-hosted unless a repository variable names another (Blacksmith, as SolidCraft
# uses): RUNNER_LINUX, RUNNER_LINUX_ARM, RUNNER_MACOS, RUNNER_WINDOWS, RUNNER_WINDOWS_ARM.
# Linux builds on Ubuntu 22.04, so the binaries need only glibc 2.35.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # One Rust for every release build. Cargo.toml's rust-version is the oldest that builds.
  RUST_TOOLCHAIN: "1.100.0"
  NFPM_VERSION: "2.47.0"
  WIX_VERSION: "5.0.2"

jobs:
  version:
    # A server release (tag server-vX.Y.Z) is the server image's, not this one's: skip it.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      override: ${{ steps.v.outputs.override }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Resolve version
        env:
          TAG: ${{ github.event.release.tag_name }}
          MARKED_PRERELEASE: ${{ github.event.release.prerelease || false }}
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          . packaging/env.sh
          workspace="$VERSION"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            case "$TAG" in
              v*) VERSION="${TAG#v}" ;;
              *) echo "::error::the release tag must be v<version>, like v1.2.3, not '$TAG'"; exit 1 ;;
            esac
          elif [ -n "$DRY_RUN_VERSION" ]; then
            VERSION="$DRY_RUN_VERSION"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::the version must look like 1.2.3 or 1.2.3-rc.1, not '$VERSION'"
            exit 1
          fi
          case "$VERSION" in *-*) pre=true ;; *) pre="$MARKED_PRERELEASE" ;; esac
          override=false
          if [ "$VERSION" != "$workspace" ]; then
            override=true
            echo "::notice::Building $VERSION; Cargo.toml says $workspace."
          fi
          {
            echo "version=$VERSION"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "prerelease=$pre"
            echo "override=$override"
          } >>"$GITHUB_OUTPUT"
          echo "### CraftRadio v$VERSION (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    if: vars.RELEASE_LINUX == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: ${{ github.event_name == 'release' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: "${{ vars.RUNNER_LINUX || 'ubuntu-22.04' }}", deb: amd64 }
          - { arch: aarch64, runner: "${{ vars.RUNNER_LINUX_ARM || 'ubuntu-22.04-arm' }}", deb: arm64 }
    env:
      CRAFTRADIO_VERSION: ${{ needs.version.outputs.version }}
      CRAFTRADIO_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libasound2-dev pkg-config cmake \
            desktop-file-utils appstream zsync rpm
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Apply version override
        if: needs.version.outputs.override == 'true'
        run: cargo xtask version set "$CRAFTRADIO_VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/craftradio$|usr/bin/craftradio-cli$|metainfo|applications'
          rpm -qip dist/release/*.rpm
          rpm -qlp dist/release/*.rpm | grep -E '/usr/bin/craftradio$'
          tar -tzf dist/release/*.tar.gz | grep -E '/craftradio$'
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
            test -s "$appimage.zsync"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-15' }}
    timeout-minutes: 120
    environment: ${{ github.event_name == 'release' && 'release' || '' }}
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    env:
      CRAFTRADIO_VERSION: ${{ needs.version.outputs.version }}
      CRAFTRADIO_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos
      - name: Apply version override
        if: needs.version.outputs.override == 'true'
        run: cargo xtask version set "$CRAFTRADIO_VERSION"
      - name: Import the signing certificate (skipped without one)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign and notarize (ad-hoc signed without a certificate)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal
      - name: Verify the signature and notarization
        if: env.MACOS_SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/verify.sh --arch universal
      - id: signed
        name: Note an unsigned build
        run: |
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "::warning::No APPLE_CERTIFICATE, so the macOS packages are ad-hoc signed and not notarized."
          fi
      - name: Remove the temporary keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: ${{ github.event_name == 'release' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc, runner: "${{ vars.RUNNER_WINDOWS || 'windows-2025' }}" }
          - { arch: arm64, target: aarch64-pc-windows-msvc, runner: "${{ vars.RUNNER_WINDOWS_ARM || 'windows-11-arm' }}" }
    env:
      CRAFTRADIO_VERSION: ${{ needs.version.outputs.version }}
      CRAFTRADIO_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Apply version override
        if: needs.version.outputs.override == 'true'
        shell: bash
        run: cargo xtask version set "$CRAFTRADIO_VERSION"
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION" "WixToolset.Util.wixext/$env:WIX_VERSION"
      - name: Build, sign and package (unsigned without signing secrets)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Attach to the release, or keep the dry-run files
    needs: [version, linux, macos, windows]
    if: ${{ !cancelled() && needs.version.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ github.event_name == 'release' && 'release' || '' }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums (the in-app updater reads SHA256SUMS.txt)
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Sign the checksum list (skipped without LINUX_SIGNING_KEY)
        if: vars.RELEASE_LINUX == 'true'
        working-directory: artifacts
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: |
          if [ -z "$LINUX_SIGNING_KEY" ]; then
            echo "::warning::No LINUX_SIGNING_KEY: SHA256SUMS.txt stays unsigned."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s\n' "$LINUX_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --armor --detach-sign -o SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          rm -rf "$GNUPGHOME"
      - name: Attach the files to the release
        if: github.event_name == 'release'
        working-directory: artifacts
        env:
          TAG: ${{ github.event.release.tag_name }}
          MARKED_PRERELEASE: ${{ github.event.release.prerelease }}
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          # A suffixed version is a prerelease even when it was published as a release: it must not
          # become "latest", the page the README links and stable installs read.
          if [ "$PRERELEASE" = true ] && [ "$MARKED_PRERELEASE" != true ]; then
            echo "::warning::v$VERSION has a pre-release suffix, so it is marked as a prerelease."
            gh release edit "$TAG" --prerelease --latest=false
          fi
          # SHA256SUMS.txt goes last: the updater offers a release only once its checksums are there.
          files=()
          for f in *; do
            case "$f" in SHA256SUMS.txt*) ;; *) files+=("$f") ;; esac
          done
          gh release upload "$TAG" --clobber -- "${files[@]}"
          gh release upload "$TAG" --clobber -- SHA256SUMS.txt*
          # An unsigned macOS build is allowed; the notes say how to open it.
          if [ "$MACOS_SIGNED" != true ]; then
            note="**macOS:** this build is not signed or notarized. After copying CraftRadio to Applications, run \`xattr -dr com.apple.quarantine /Applications/CraftRadio.app\` once, or Control-click the app and choose Open."
            body="$(gh release view "$TAG" --json body --jq .body)"
            if ! printf '%s' "$body" | grep -Fq 'not signed or notarized'; then
              printf '%s\n\n%s\n' "$body" "$note" >"$RUNNER_TEMP/notes.md"
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          fi
          kind=release
          if [ "$PRERELEASE" = true ]; then kind=prerelease; fi
          {
            echo "Attached to $kind **$TAG** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Keep the files (dry run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts/*
