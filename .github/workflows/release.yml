# Release pipeline, after SolidCraft's (tangency-labs/solidcraft, MIT OR Apache-2.0), which follows
# PhotoCraft's. See docs/releasing.md.
#
# A push to `release` builds every package and creates or updates a DRAFT GitHub Release. The version
# comes from [workspace.package] in Cargo.toml. A maintainer publishes the draft.
# A dispatched run is a dry run: it builds and checks every package and keeps them as the run's
# `release-assets` artifact. `draft: true` on the release branch makes a draft as a push does.
#
#   Linux x86_64, aarch64   AppImage (+ .zsync), .deb, .rpm, .tar.gz   packaging/linux/package.sh
#   macOS universal         .dmg, and the CLI as a .zip                packaging/macos/package.sh
#   Windows x64, arm64      .msi and a portable .zip                   packaging/windows/package.ps1
#
# Signing is optional, as in SolidCraft: each platform signs when its secrets exist and builds
# unsigned, with a warning, when they don't. macOS: APPLE_*. Windows: WINDOWS_CERTIFICATE or the
# AZURE_* Trusted Signing values. SHA256SUMS.txt: LINUX_SIGNING_KEY. They live in the repository's
# `release` environment, which only the release branch uses.
#
# Runners are GitHub-hosted unless a repository variable names another (Blacksmith, as SolidCraft
# uses): RUNNER_LINUX, RUNNER_LINUX_ARM, RUNNER_MACOS, RUNNER_WINDOWS, RUNNER_WINDOWS_ARM.
# Linux builds on Ubuntu 22.04, so the binaries need only glibc 2.35.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""
      draft:
        description: "Create/update a draft (release branch only; off: build artifacts only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # One Rust for every release build. Cargo.toml's rust-version is the oldest that builds.
  RUST_TOOLCHAIN: "1.100.0"
  NFPM_VERSION: "2.47.0"
  WIX_VERSION: "5.0.2"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Resolve version
        env:
          CRAFTRADIO_VERSION: ${{ inputs.version }}
          REQUEST_DRAFT: ${{ inputs.draft || false }}
        run: |
          [ -n "$CRAFTRADIO_VERSION" ] || unset CRAFTRADIO_VERSION
          . packaging/env.sh
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::the version must look like 1.2.3 or 1.2.3-rc.1, not '$VERSION'"
            exit 1
          fi
          if [ "$REQUEST_DRAFT" = true ] && [ "$GITHUB_REF" != refs/heads/release ]; then
            echo "::error::Draft releases must be built from the release branch"
            exit 1
          fi
          case "$VERSION" in *-*) pre=true ;; *) pre=false ;; esac
          { echo "version=$VERSION"; echo "date=$(date -u +%Y-%m-%d)"; echo "prerelease=$pre"; } >>"$GITHUB_OUTPUT"
          echo "### CraftRadio v$VERSION (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: ${{ github.ref == 'refs/heads/release' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: "${{ vars.RUNNER_LINUX || 'ubuntu-22.04' }}", deb: amd64 }
          - { arch: aarch64, runner: "${{ vars.RUNNER_LINUX_ARM || 'ubuntu-22.04-arm' }}", deb: arm64 }
    env:
      CRAFTRADIO_VERSION: ${{ needs.version.outputs.version }}
      CRAFTRADIO_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libasound2-dev pkg-config cmake \
            desktop-file-utils appstream zsync rpm
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$CRAFTRADIO_VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/craftradio$|usr/bin/craftradio-cli$|metainfo|applications'
          rpm -qip dist/release/*.rpm
          rpm -qlp dist/release/*.rpm | grep -E '/usr/bin/craftradio$'
          tar -tzf dist/release/*.tar.gz | grep -E '/craftradio$'
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
            test -s "$appimage.zsync"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-15' }}
    timeout-minutes: 120
    environment: ${{ github.ref == 'refs/heads/release' && 'release' || '' }}
    env:
      CRAFTRADIO_VERSION: ${{ needs.version.outputs.version }}
      CRAFTRADIO_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$CRAFTRADIO_VERSION"
      - name: Import the signing certificate (skipped without one)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign and notarize (ad-hoc signed without a certificate)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal
      - name: Verify the signature and notarization
        if: env.MACOS_SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/verify.sh --arch universal
      - name: Note an unsigned build
        if: env.MACOS_SIGN_IDENTITY == ''
        run: |
          echo "::warning::No APPLE_CERTIFICATE, so the macOS packages are ad-hoc signed and not notarized."
      - name: Remove the temporary keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: ${{ github.ref == 'refs/heads/release' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc, runner: "${{ vars.RUNNER_WINDOWS || 'windows-2025' }}" }
          - { arch: arm64, target: aarch64-pc-windows-msvc, runner: "${{ vars.RUNNER_WINDOWS_ARM || 'windows-11-arm' }}" }
    env:
      CRAFTRADIO_VERSION: ${{ needs.version.outputs.version }}
      CRAFTRADIO_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$CRAFTRADIO_VERSION"
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION" "WixToolset.Util.wixext/$env:WIX_VERSION"
      - name: Build, sign and package (unsigned without signing secrets)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: GitHub Release or dry-run artifacts
    needs: [version, linux, macos, windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/release' && 'release' || '' }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums (the in-app updater reads SHA256SUMS.txt)
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Sign the checksum list (skipped without LINUX_SIGNING_KEY)
        working-directory: artifacts
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: |
          if [ -z "$LINUX_SIGNING_KEY" ]; then
            echo "::warning::No LINUX_SIGNING_KEY: SHA256SUMS.txt stays unsigned."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s\n' "$LINUX_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --armor --detach-sign -o SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          rm -rf "$GNUPGHOME"
      - name: Create or update the draft release
        if: github.ref == 'refs/heads/release' && (github.event_name == 'push' || inputs.draft)
        working-directory: artifacts
        run: |
          tag="v$VERSION"
          # A draft must point at this build: never reuse or move an existing tag.
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')"
          if printf '%s\n' "$existing" | grep -Fxq "refs/tags/$tag"; then
            echo "::error::Tag $tag already exists. Choose a new version; never move a release tag."
            exit 1
          fi
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::Release $tag is already published. Bump the version before releasing."
              exit 1
            fi
            # Replace the whole asset set, including files this build no longer makes.
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              if [ -n "$asset" ]; then gh release delete-asset "$tag" "$asset" --yes; fi
            done
            gh release edit "$tag" --draft --title "CraftRadio v$VERSION" \
              --target "$GITHUB_SHA" --prerelease="$PRERELEASE"
            gh release upload "$tag" --clobber -- *
          else
            gh release create "$tag" --draft --title "CraftRadio v$VERSION" \
              --target "$GITHUB_SHA" --generate-notes "${pre[@]}" -- *
          fi
          {
            echo "Draft **CraftRadio v$VERSION** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Keep the files (dry run)
        if: ${{ !(github.ref == 'refs/heads/release' && (github.event_name == 'push' || inputs.draft)) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts/*
