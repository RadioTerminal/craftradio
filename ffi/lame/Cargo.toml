# Our own bindings to the LAME shared library, under the licence of this repository.
# The FFI needs unsafe code, so this crate is not a workspace member (AGENTS.md rule 5).
# The lints below replace the workspace lints, and they let this crate use unsafe code.
[package]
name = "radio-lame"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false
links = "mp3lame"

[[test]]
name = "it"
path = "tests/it/main.rs"

[build-dependencies]
pkg-config = "0.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
