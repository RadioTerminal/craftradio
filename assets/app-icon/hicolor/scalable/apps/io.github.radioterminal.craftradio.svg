  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <g fill="none" stroke="#fff6ec" stroke-linecap="round" stroke-width="30">
    <path d="M176 140a136 136 0 0 0 0 192"/>
    <path d="M336 140a136 136 0 0 1 0 192"/>
    <path d="M122 92a204 204 0 0 0 0 288" opacity="0.7"/>
