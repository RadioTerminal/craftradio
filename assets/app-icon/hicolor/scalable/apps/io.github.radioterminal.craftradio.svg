<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- CraftRadio app icon: an on-air mark (a mast with broadcast waves) on a deep red tile.
       Full-bleed 512 tile; packaging/icons.sh renders every platform's icon from this file. -->
