<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tune in</title>
<meta name="description" content="Listen to a radio station live, straight from its computer.">
<meta name="theme-color" content="#16181d">
<style>
  :root {
    --a: #3b4a6b; --b: #6b3b52;                 /* fallback colours, set per station */
    --text: #ffffff; --soft: rgba(255,255,255,.72); --faint: rgba(255,255,255,.45);
    --glass: rgba(22,24,29,.42); --edge: rgba(255,255,255,.14);
    --live: #ff4d5e; --focus: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); background: #16181d;
    font: 400 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }

  /* The blurred cover behind everything */
  .backdrop { position: fixed; inset: -10%; z-index: 0; background: linear-gradient(135deg, var(--a), var(--b));
              background-size: cover; background-position: center;
              filter: blur(70px) saturate(1.5) brightness(.75); transform: scale(1.15);
              transition: background-image .8s ease, opacity .8s ease; }
  .backdrop.art { background-image: var(--art); }
  .shade { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 50% 30%, transparent 0, rgba(0,0,0,.45) 75%); }

  main { position: relative; z-index: 1; min-height: 100%; display: grid; place-items: center; padding: 28px 16px 40px; }
  .stack { width: 100%; max-width: 400px; }

  /* The player */
  .player { position: relative; border-radius: 26px; overflow: hidden; background: #22252c;
            box-shadow: 0 40px 80px -30px rgba(0,0,0,.7), 0 0 0 1px var(--edge); }
  .cover { position: relative; aspect-ratio: 1 / 1; background: linear-gradient(135deg, var(--a), var(--b)); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s ease; }
  .cover img.shown { opacity: 1; z-index: 1; }
  .cover:has(img.shown) .placeholder { visibility: hidden; }
  .cover .placeholder { position: absolute; inset: 0; display: grid; place-items: center; }
  .cover .placeholder svg { width: 34%; opacity: .55; }
  /* The scrim under the title sits above the cover, so the text reads on any artwork. */
  .cover::after { content: ""; position: absolute; z-index: 1; inset: auto 0 0; height: 55%; pointer-events: none;
                  background: linear-gradient(rgba(12,14,18,0) 0%, rgba(12,14,18,.55) 40%, rgba(12,14,18,.88) 100%); }

  .chip { position: absolute; z-index: 2; top: 14px; display: inline-flex; align-items: center; gap: 7px;
          height: 30px; padding: 0 12px; border-radius: 15px; font-size: 13px; font-weight: 600;
          background: rgba(20,22,27,.5); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
          box-shadow: inset 0 0 0 1px var(--edge); color: var(--text); }
  .chip.left { left: 14px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .chip.on i { background: var(--live); box-shadow: 0 0 10px var(--live); }
  button.chip { right: 14px; border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; }
  button.chip svg { width: 15px; height: 15px; }

  .info { position: absolute; z-index: 2; left: 20px; right: 20px; bottom: 16px; }
  #now { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0,0,0,.6), 0 0 18px rgba(0,0,0,.45); }
  #artist { margin: 2px 0 0; font-size: 16px; color: rgba(255,255,255,.86); text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.45em; }

  /* The glass bar with the controls */
  .bar { padding: 14px 20px 20px; background: var(--glass); -webkit-backdrop-filter: blur(30px) saturate(1.4); backdrop-filter: blur(30px) saturate(1.4); }
  .meter { display: flex; gap: 3px; align-items: flex-end; height: 16px; }
  .meter b { flex: 1; height: 12%; border-radius: 2px; background: rgba(255,255,255,.22); transition: height .08s linear; }
  .meter.live b { background: rgba(255,255,255,.78); }
  .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 14px; }
  #state { margin: 0; font-size: 13px; color: var(--soft); }
  .play { width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
          background: var(--text); color: #16181d; box-shadow: 0 8px 24px -8px rgba(0,0,0,.6);
          transition: transform .12s ease; }
  .play:active { transform: scale(.94); }
  .play svg { width: 26px; height: 26px; }
  .volume { justify-self: end; display: flex; align-items: center; gap: 8px; color: var(--soft); }
  .volume svg { width: 18px; height: 18px; flex: none; }
  input[type=range] { width: 92px; accent-color: #fff; }

  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  /* What played before: a frosted card under the player */
  .history { margin-top: 16px; border-radius: 22px; padding: 14px 6px 8px; background: var(--glass);
             -webkit-backdrop-filter: blur(30px) saturate(1.4); backdrop-filter: blur(30px) saturate(1.4);
             box-shadow: 0 0 0 1px var(--edge); }
  .history h2 { margin: 0; font: inherit; }
  .history-toggle { width: 100%; display: flex; align-items: center; gap: 8px; padding: 2px 14px 6px;
                    border: 0; background: none; color: var(--soft); font: inherit; font-size: 13px; font-weight: 600;
                    cursor: pointer; text-align: left; }
  .history-toggle .count { color: var(--faint); font-weight: 500; }
  .history-toggle svg { width: 16px; height: 16px; margin-left: auto; transition: transform .2s ease; }
  .history-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .history:not(.open) { padding-bottom: 8px; }
  .history ol { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto;
                scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.22) transparent; }
  .history:not(.open) ol { display: none; }
  .history li { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center;
                padding: 8px 14px; border-radius: 12px; }
  .history li + li { box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  .history .tile { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; overflow: hidden;
                   font-weight: 700; font-size: 15px; color: rgba(255,255,255,.92); }
  .history .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .history .what { min-width: 0; }
  .history .t { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history .a { margin: 1px 0 0; font-size: 13px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history time { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Under the player */
  .tuner { margin-top: 18px; padding: 0 4px; color: var(--soft); }
  .tuner summary { cursor: pointer; font-size: 14px; list-style: none; }
  .tuner summary::-webkit-details-marker { display: none; }
  .tuner[open] summary { color: var(--text); }
  .field { display: flex; gap: 8px; margin-top: 10px; }
  .field input { flex: 1; min-width: 0; padding: 11px 13px; font: inherit; color: var(--text);
                 background: rgba(255,255,255,.1); border: 1px solid var(--edge); border-radius: 12px; }
  .field input::placeholder { color: var(--faint); }
  .field button { padding: 0 16px; border: 0; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer;
                  background: rgba(255,255,255,.9); color: #16181d; }
  .hint { margin: 10px 0 0; font-size: 13px; color: var(--faint); }
  .hint code { color: var(--soft); font-size: 12.5px; }

  @media (prefers-reduced-motion: reduce) {
    .backdrop, .cover img, .play, .meter b { transition: none; }
  }
</style>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>
<main>
  <div class="stack">
    <section class="player" aria-label="Player">
      <div class="cover">
        <div class="placeholder" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>
        </div>
        <img id="art" alt="">
        <span class="chip left" id="lamp"><i aria-hidden="true"></i><span id="lamp-text">Off air</span></span>
        <button class="chip" id="share" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span id="share-text">Copy link</span>
        </button>
        <div class="info">
          <p id="now" aria-live="polite">Radio</p>
          <p id="artist"></p>
        </div>
      </div>
      <div class="bar">
        <div class="meter" id="meter" aria-hidden="true"></div>
        <div class="row">
          <p id="state" role="status">Ready</p>
          <button id="listen" class="play" type="button" aria-label="Listen">
            <svg id="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          </button>
          <label class="volume">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
          </label>
        </div>
      </div>
    </section>

    <section class="history" id="history" aria-labelledby="history-title" hidden>
      <h2 id="history-title">
        <button class="history-toggle" id="history-toggle" type="button" aria-expanded="false" aria-controls="history-list">
          Earlier this hour <span class="count" id="history-count"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </h2>
      <ol id="history-list"></ol>
    </section>

    <details class="tuner" id="tuner">
      <summary>Listen to another station</summary>
      <div class="field">
        <input id="station" type="text" placeholder="Station link or address" autocomplete="off" spellcheck="false" aria-label="Station link or address" aria-describedby="station-hint">
        <button id="tune" type="button">Tune in</button>
      </div>
      <p class="hint" id="station-hint">Paste the link a station shares, an address such as <code>http://192.168.1.20:8000</code>, or a TinyIce mount such as <code>https://radio.example.com/live</code>.</p>
    </details>
  </div>
  <audio id="audio" autoplay></audio>
</main>
<script>
"use strict";
const ICE = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun.cloudflare.com:3478"] }];
const TRACKERS = ["wss://tracker.openwebtorrent.com", "wss://tracker.webtorrent.dev"];
const SIG = "a=x-radio-sig:";
const $ = (id) => document.getElementById(id);
const input = $("station"), button = $("listen"), state = $("state"), nowEl = $("now"), artistEl = $("artist");
const audio = $("audio"), art = $("art"), backdrop = $("backdrop"), lamp = $("lamp"), lampText = $("lamp-text");
const meter = $("meter"), shareBtn = $("share"), shareText = $("share-text"), icon = $("icon");
const BARS = 28;
for (let i = 0; i < BARS; i++) meter.appendChild(document.createElement("b"));
const PLAY = '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>';
const STOP = '<rect x="6.5" y="6.5" width="11" height="11" rx="2"/>';

let pc = null, resource = null, poll = null, ctx = null, raf = 0, sockets = [], coverUrl = null, cover = null, gotMeta = false;

// A station is either an ID (from a shared link) or an http(s) address.
const ID_RE = /^[A-Za-z0-9_-]{43}$/;
function parseStation(text) {
  text = (text || "").trim();
  const hash = text.includes("#") ? text.slice(text.indexOf("#") + 1) : text;
  if (ID_RE.test(hash)) return { kind: "id", id: hash, label: hash };
  if (/^https?:\/\//.test(text)) return { kind: "url", url: text.replace(/\/+$/, ""), label: text };
  return null;
}
const served = !location.hostname.endsWith("github.io") && location.protocol.startsWith("http");
const fromLink = parseStation(location.hash.slice(1)) || parseStation(new URLSearchParams(location.search).get("station") || "");
let station = fromLink || (served ? { kind: "url", url: location.origin, label: location.origin } : null);
if (station) input.value = station.kind === "id" ? location.origin + location.pathname + "#" + station.id : station.url;
else $("tuner").open = true;

function say(text) { state.textContent = text; }
function setIcon(playing) { icon.innerHTML = playing ? STOP : PLAY; button.setAttribute("aria-label", playing ? "Stop" : "Listen"); }
function onAir(on) { lamp.classList.toggle("on", on); lampText.textContent = on ? "Live" : "Off air"; }

// Each station gets its own colours, so a station without a cover still looks like itself.
function paint(key) {
  let h = 2166136261;
  for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const hue = h % 360;
  document.documentElement.style.setProperty("--a", `hsl(${hue} 45% 34%)`);
  document.documentElement.style.setProperty("--b", `hsl(${(hue + 55) % 360} 50% 28%)`);
}
if (station) paint(station.label);

function setNow(title, artist) {
  nowEl.textContent = title || "Radio";
  artistEl.textContent = artist || "";
  document.title = title ? title + (artist ? " – " + artist : "") : "Tune in";
  updateSession();
}
function setCover(url) {
  if (coverUrl) URL.revokeObjectURL(coverUrl);
  coverUrl = url;
  if (url) {
    art.src = url; art.onload = () => art.classList.add("shown");
    backdrop.style.setProperty("--art", `url("${url}")`); backdrop.classList.add("art");
  } else {
    art.classList.remove("shown"); art.removeAttribute("src");
    backdrop.classList.remove("art");
  }
  updateSession();
}
function updateSession() {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: nowEl.textContent, artist: artistEl.textContent, album: "Live radio",
    artwork: coverUrl ? [{ src: coverUrl }] : [],
  });
}
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => { if (!wanted) start(); });
  navigator.mediaSession.setActionHandler("stop", () => stop());
  navigator.mediaSession.setActionHandler("pause", () => stop());
}

// What plays now arrives on the data channel: a "now" message, then the cover in parts.
// What played before, newest first, from the station's "history" message. Its covers come
// as small "thumb" pictures, each once, by key.
let played = [];
const thumbs = new Map();
const toggle = $("history-toggle");
function setOpen(open) {
  $("history").classList.toggle("open", open);
  toggle.setAttribute("aria-expanded", String(open));
  try { localStorage.setItem("historyOpen", open ? "1" : "0"); } catch (_) {}
}
toggle.addEventListener("click", () => setOpen(toggle.getAttribute("aria-expanded") !== "true"));
try { setOpen(localStorage.getItem("historyOpen") === "1"); } catch (_) { setOpen(false); }
function tileColours(key) {
  let h = 2166136261;
  for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const hue = h % 360;
  return `linear-gradient(135deg, hsl(${hue} 45% 42%), hsl(${(hue + 50) % 360} 50% 30%))`;
}
function ago(ms) {
  const min = Math.round((Date.now() - ms) / 60000);
  return min < 1 ? "just now" : min + " min ago";
}
function renderHistory() {
  const list = $("history-list");
  list.replaceChildren();
  for (const p of played) {
    const li = document.createElement("li");
    const tile = document.createElement("span");
    tile.className = "tile"; tile.setAttribute("aria-hidden", "true");
    tile.style.background = tileColours(p.artist + p.title);
    const picture = p.thumb && thumbs.get(p.thumb);
    if (picture) { const img = document.createElement("img"); img.src = picture; img.alt = ""; tile.append(img); }
    else tile.textContent = (p.title.trim()[0] || "♪").toUpperCase();
    const what = document.createElement("div"); what.className = "what";
    const t = document.createElement("p"); t.className = "t"; t.textContent = p.title;
    what.append(t);
    if (p.artist) { const a = document.createElement("p"); a.className = "a"; a.textContent = p.artist; what.append(a); }
    const when = document.createElement("time");
    const at = new Date(p.at);
    when.dateTime = at.toISOString();
    when.title = at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    when.textContent = ago(p.at);
    li.append(tile, what, when);
    list.append(li);
  }
  $("history").hidden = played.length === 0;
  $("history-count").textContent = played.length ? "· " + played.length : "";
}
setInterval(() => { if (played.length) renderHistory(); }, 30000);

function onMessage(text) {
  let m; try { m = JSON.parse(text); } catch (_) { setNow(text, ""); return; }
  if (m.type === "history") { played = Array.isArray(m.items) ? m.items : []; renderHistory(); return; }
  if (m.type === "thumb") {
    if (typeof m.key === "string" && typeof m.data === "string") thumbs.set(m.key, "data:image/jpeg;base64," + m.data);
    renderHistory(); return;
  }
  gotMeta = true;
  if (m.type === "now") {
    setNow(m.title, m.artist);
    if (!m.cover) { cover = null; setCover(null); }
    else cover = { id: m.cover.id, mime: m.cover.mime, parts: new Array(m.cover.parts), left: m.cover.parts };
  } else if (m.type === "cover" && cover && m.id === cover.id && cover.parts[m.part] === undefined) {
    cover.parts[m.part] = Uint8Array.from(atob(m.data), (c) => c.charCodeAt(0));
    if (--cover.left === 0) setCover(URL.createObjectURL(new Blob(cover.parts, { type: cover.mime })));
  }
}

function startMeter(stream) {
  try {
    ctx = new AudioContext();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    ctx.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const bars = meter.children;
    // Bands on a log scale, as the ear hears them.
    const edges = Array.from({ length: BARS + 1 }, (_, i) => Math.min(data.length, Math.round(Math.pow(data.length, i / BARS))));
    meter.classList.add("live");
    const draw = () => {
      analyser.getByteFrequencyData(data);
      for (let i = 0; i < BARS; i++) {
        let v = 0;
        for (let j = edges[i]; j < Math.max(edges[i + 1], edges[i] + 1); j++) v = Math.max(v, data[j] || 0);
        bars[i].style.height = Math.max(12, v / 255 * 100) + "%";
      }
      raf = requestAnimationFrame(draw);
    };
    draw();
  } catch (_) { /* The meter is optional; the sound plays without it. */ }
}
function stopMeter() {
  cancelAnimationFrame(raf);
  if (ctx) ctx.close().catch(() => {});
  ctx = null;
  meter.classList.remove("live");
  for (const b of meter.children) b.style.height = "";
}

function closeTrackers() { for (const s of sockets) { try { s.close(); } catch (_) {} } sockets = []; }

// The listener wants to hear the station from Play until Stop. In between, a lost or
// failed connection retries on its own, so a station that restarts comes back.
let wanted = false, attempt = 0, retryTimer = null, lostTimer = null, gen = 0;

// Ends the connection, but not the wish to listen.
function teardown() {
  gen++;
  clearTimeout(lostTimer); lostTimer = null;
  clearInterval(poll); poll = null;
  closeTrackers();
  if (resource) fetch(resource, { method: "DELETE" }).catch(() => {});
  if (pc) pc.close();
  pc = null; resource = null;
  stopMeter();
  audio.srcObject = null;
  onAir(false);
}

async function stop(message) {
  wanted = false;
  clearTimeout(retryTimer); retryTimer = null;
  teardown();
  setIcon(false);
  say(message || "Stopped");
}

function start() {
  wanted = true; attempt = 0;
  clearTimeout(retryTimer); retryTimer = null;
  listen();
}

// Tries again after 2, 4, 8, 16, then every 30 seconds, while the listener wants to listen.
function retry(reason) {
  if (!wanted) return;
  teardown();
  attempt = Math.min(attempt + 1, 5);
  const delay = Math.min(30, 2 ** attempt);
  setIcon(true);
  say(reason + " Trying again in " + delay + " s…");
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { retryTimer = null; if (wanted) listen(); }, delay * 1000);
}

// An error that a retry cannot fix.
function lasting(message) { const e = new Error(message); e.lasting = true; return e; }

function randomId(n) {
  const a = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => a[b % a.length]).join("");
}
function b64url(text) {
  const s = atob(text.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((text.length + 3) % 4));
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
}

// Through the trackers: post the offer to the station's swarm, take the first answer
// that carries the signature of the station key.
async function viaTrackers(id, offerSdp) {
  const publicKey = b64url(id);
  // Browsers check signatures only on https:// pages and on this computer.
  if (!window.isSecureContext || !crypto.subtle) {
    throw lasting("a station link needs a secure page. Open https://radioterminal.github.io/craftradio/#" + id);
  }
  let key;
  try { key = await crypto.subtle.importKey("raw", publicKey, { name: "Ed25519" }, false, ["verify"]); }
  catch (_) { throw lasting("this browser cannot check the station signature. Update it, or open the station address directly"); }
  const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", publicKey));
  const infoHash = Array.from(digest, (b) => b.toString(16).padStart(2, "0")).join("").slice(0, 20);
  const peerId = randomId(20);
  return new Promise((resolve, reject) => {
    const ids = new Set();
    let done = false, open = 0;
    const offers = () => Array.from({ length: 5 }, () => {
      const offerId = randomId(20); ids.add(offerId);
      return { offer: { type: "offer", sdp: offerSdp }, offer_id: offerId };
    });
    const announce = (ws) => ws.readyState === 1 && ws.send(JSON.stringify({
      action: "announce", info_hash: infoHash, peer_id: peerId, numwant: 5,
      uploaded: 0, downloaded: 0, left: 1, event: "started", offers: offers(),
    }));
    const timer = setTimeout(() => finish(new Error("the station did not answer. It may be off air")), 20000);
    const again = setInterval(() => sockets.forEach(announce), 5000);
    function finish(result) {
      if (done) return; done = true;
      clearTimeout(timer); clearInterval(again); closeTrackers();
      result instanceof Error ? reject(result) : resolve(result);
    }
    for (const url of TRACKERS) {
      let ws;
      try { ws = new WebSocket(url); } catch (_) { continue; }
      sockets.push(ws);
      ws.onopen = () => { open++; announce(ws); };
      ws.onerror = () => { if (!sockets.some((s) => s.readyState <= 1) && !open) finish(new Error("no tracker could be reached")); };
      ws.onmessage = async (e) => {
        let m; try { m = JSON.parse(e.data); } catch (_) { return; }
        if (!m.answer || !ids.has(m.offer_id) || done) return;
        const signed = m.answer.sdp || "";
        const at = signed.lastIndexOf(SIG);
        if (at < 0) return;
        const sdp = signed.slice(0, at);
        const sig = b64url(signed.slice(at + SIG.length).trim());
        const ok = await crypto.subtle.verify({ name: "Ed25519" }, key, sig, new TextEncoder().encode(m.offer_id + "\n" + sdp)).catch(() => false);
        if (ok) finish(sdp);
      };
    }
    if (!sockets.length) finish(new Error("no tracker could be reached"));
  });
}

function blockedMixed(url) {
  if (location.protocol !== "https:" || !url.startsWith("http:")) return false;
  return !["localhost", "127.0.0.1", "[::1]"].includes(new URL(url).hostname);
}

async function titleFromServer(url) {
  if (gotMeta) return;
  try { const r = await fetch(url + "/now"); if (r.ok) { setNow(await r.text(), ""); return; } } catch (_) {}
  // TinyIce and Icecast give the title in their stats, by mount.
  try {
    const u = new URL(url);
    const r = await fetch(u.origin + "/status-json.xsl");
    if (!r.ok) return;
    const sources = [].concat(((await r.json()).icestats || {}).source || []);
    const mount = u.pathname.replace(/\/+$/, "") || "/";
    const s = sources.find((x) => (x.listenurl || "").replace(/\/+$/, "").endsWith(mount)) || sources[0];
    if (s) setNow(s.title || s.server_name || "", s.artist || "");
  } catch (_) {}
}

async function listen() {
  if (!station) { await stop("Paste a station link first"); $("tuner").open = true; input.focus(); return; }
  if (station.kind === "url" && blockedMixed(station.url)) {
    await stop("This page cannot reach an http:// station on another computer. Open " + station.url + " directly.");
    return;
  }
  teardown();
  const mine = gen;
  setIcon(true); gotMeta = false;
  say(station.kind === "id" ? "Finding the station…" : "Connecting…");
  const me = new RTCPeerConnection({ iceServers: ICE });
  pc = me;
  me.addTransceiver("audio", { direction: "recvonly" });
  const channel = me.createDataChannel("now");
  channel.onmessage = (e) => onMessage(e.data);
  me.ontrack = (e) => {
    const stream = e.streams[0] || new MediaStream([e.track]);
    audio.srcObject = stream;
    audio.play().catch(() => {});
    startMeter(stream);
  };
  me.onconnectionstatechange = () => {
    if (pc !== me) return;
    const s = me.connectionState;
    if (s === "connected") {
      attempt = 0;
      clearTimeout(lostTimer); lostTimer = null;
      onAir(true); say("Live");
    }
    if (s === "failed") retry("The connection failed.");
    if (s === "disconnected") {
      // A short drop can heal on its own. Wait a moment before a new connection.
      onAir(false); say("Connection lost, waiting…");
      clearTimeout(lostTimer);
      lostTimer = setTimeout(() => {
        if (pc === me && me.connectionState !== "connected") retry("The connection was lost.");
      }, 5000);
    }
  };
  try {
    const offer = await pc.createOffer();
    // Ask for stereo: browsers decode Opus as mono unless the offer says stereo=1.
    offer.sdp = offer.sdp.replace(/(a=fmtp:\d+ [^\r\n]*)/g, (l) => l.includes("stereo=") ? l : l + ";stereo=1");
    await pc.setLocalDescription(offer);
    await new Promise((done) => {
      if (pc.iceGatheringState === "complete") return done();
      pc.onicegatheringstatechange = () => pc.iceGatheringState === "complete" && done();
      setTimeout(done, 2000);
    });
    let answer;
    if (station.kind === "id") {
      answer = await viaTrackers(station.id, pc.localDescription.sdp);
      say("Connecting…");
    } else {
      const res = await fetch(station.url + "/whep", {
        method: "POST", headers: { "Content-Type": "application/sdp" }, body: pc.localDescription.sdp,
      });
      if (res.status !== 201) throw new Error(await res.text() || "HTTP " + res.status);
      const loc = res.headers.get("Location");
      resource = loc ? new URL(loc, station.url + "/").href : null;
      answer = await res.text();
      titleFromServer(station.url);
      poll = setInterval(() => titleFromServer(station.url), 5000);
    }
    if (gen !== mine) return;
    await me.setRemoteDescription({ type: "answer", sdp: answer });
  } catch (e) {
    if (gen !== mine) return;
    if (e.lasting) await stop("Could not tune in: " + e.message);
    else retry("Could not tune in: " + e.message + ".");
  }
}

function tuneTo(text) {
  const next = parseStation(text);
  if (!next) { say("That is not a station link or address"); input.focus(); return; }
  station = next;
  history.replaceState(null, "", next.kind === "id" ? "#" + next.id : "?station=" + encodeURIComponent(next.url));
  paint(next.label); setNow("", ""); setCover(null); played = []; renderHistory(); shareBtn.hidden = next.kind !== "id";
  $("tuner").open = false;
  stop().then(start);
}

shareBtn.hidden = !(station && station.kind === "id");
shareBtn.addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(location.href); shareText.textContent = "Copied"; }
  catch (_) { shareText.textContent = "Copy failed"; }
  setTimeout(() => (shareText.textContent = "Copy link"), 1800);
});
button.addEventListener("click", () => (wanted ? stop() : start()));
$("tune").addEventListener("click", () => tuneTo(input.value));
input.addEventListener("keydown", (e) => { if (e.key === "Enter") tuneTo(input.value); });
$("volume").addEventListener("input", (e) => { audio.volume = Number(e.target.value); });
window.addEventListener("hashchange", () => { const s = parseStation(location.hash.slice(1)); if (s && (!station || s.id !== station.id)) tuneTo(location.hash.slice(1)); });
window.addEventListener("pagehide", () => { if (resource) fetch(resource, { method: "DELETE", keepalive: true }); });
setIcon(false);
if (station) say("Press play to listen");
</script>
</body>
