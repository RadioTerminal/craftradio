[package]
name = "radio-stream"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["mp3"]
mp3 = ["radio-codecs/encode-mp3"]

[dependencies]
radio-codecs = { workspace = true, features = ["encode"] }
percent-encoding.workspace = true
opus.workspace = true
str0m.workspace = true
igd-next.workspace = true
natpmp.workspace = true
ring.workspace = true
tungstenite.workspace = true
serde_json.workspace = true
lofty.workspace = true
# Thumbnails of the history covers for listeners.
image.workspace = true
rtrb.workspace = true
base64.workspace = true
# TLS for https streams: rustls with the ring provider that the Icecast output uses too.
ureq = { workspace = true, features = ["rustls-no-provider"] }
symphonia.workspace = true
jiff.workspace = true
thiserror.workspace = true

rustls.workspace = true
rustls-native-certs.workspace = true

[dev-dependencies]
ogg.workspace = true
rcgen.workspace = true
ring.workspace = true
