[package]
name = "radio-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Station keys: random bytes and SHA-256.
ring.workspace = true
base64.workspace = true
# Query strings of metadata updates.
percent-encoding.workspace = true
serde.workspace = true
# The public stats document.
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
# TLS from certificate files, with the ring provider the app's Icecast output uses too.
rustls.workspace = true

[dev-dependencies]
# The app's own Ogg/Opus encoder builds the test streams.
radio-stream.workspace = true
# Test certificates, made when the tests run.
rcgen.workspace = true
tempfile.workspace = true
