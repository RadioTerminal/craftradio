[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
symphonia-adapter-libopus = "0.3"
lofty = "0.22"
ebur128 = "0.1"
blake3 = "1"
notify = "8"
tempfile = "3"
mp3lame-encoder = "0.3"
percent-encoding = "2"
opus = "0.3"
ogg = "0.9"
base64 = "0.22"
ureq = { version = "3", default-features = false }
rquickjs = "0.14"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
cpal = "0.18"
rand_chacha = "0.9"
clap = { version = "4", features = ["derive"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "all-meta"] }
rubato = "5"
rtrb = "0.4"
hound = "3.5"
assert_no_alloc = { version = "1", default-features = false, features = ["warn_debug", "warn_release"] }
radio-model = { path = "crates/model" }
radio-scheduler = { path = "crates/scheduler" }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
radio-testkit = { path = "crates/testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
