[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rquickjs = "0.14"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
rand_chacha = "0.9"
clap = { version = "4", features = ["derive"] }
proptest = "1"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "all-meta"] }
rubato = "5"
rtrb = "0.4"
hound = "3"
assert_no_alloc = { version = "1", default-features = false, features = ["warn_debug", "warn_release"] }
radio-model = { path = "crates/model" }
radio-testkit = { path = "crates/testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
