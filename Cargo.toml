[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# WebRTC listening (WHEP). aws-lc is ISC/Apache-2.0/MIT/BSD-3-Clause.
# Ed25519 station identity (already used by rustls).
ring = "0.17"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "__rustls-tls"] }
# UPnP port mapping on the home router for WebRTC listening.
igd-next = { version = "0.18", default-features = false, features = ["io_sync"] }
# NAT-PMP port mapping, for routers without UPnP. No async runtime.
natpmp = { version = "0.5", default-features = false }
str0m = { version = "0.25", default-features = false, features = ["aws-lc-rs"] }
lofty = "0.25"
ebur128 = "0.1"
blake3 = "1"
notify = "8"
tempfile = "3"
# Native MP3 encoder for the Icecast output (MIT OR Apache-2.0).
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "a7f8dd621e0d95dc81fb455a35467cbd56d75e3d", default-features = false, features = ["mp3-encode"] }
percent-encoding = "2"
opus = "0.4"
ogg = "0.9"
base64 = "0.23"
ureq = { version = "3", default-features = false }
rquickjs = "0.14"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
dirs = "7"
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
cpal = "0.18"
rand_chacha = "0.10"
proptest = "1"
clap = { version = "4", features = ["derive"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "all-meta"] }
rubato = "5"
# Program compressor and lookahead limiter.
bisque = { version = "=0.1.0", default-features = false, features = ["dynamics", "mastering"] }
rtrb = "0.4"
hound = "3.5"
assert_no_alloc = { version = "1", default-features = false, features = ["warn_debug", "warn_release"] }
radio-model = { path = "crates/model" }
radio-scheduler = { path = "crates/scheduler" }
radio-timing = { path = "crates/timing" }
radio-engine = { path = "crates/engine" }
radio-audio = { path = "crates/audio" }
radio-audio-device = { path = "crates/audio-device" }
radio-library = { path = "crates/library" }
radio-codecs = { path = "crates/codecs" }
radio-control = { path = "crates/control" }
radio-mcp = { path = "crates/mcp" }
# The radio app explicitly enables MP3 output; other consumers opt in.
radio-stream = { path = "crates/stream", default-features = false }
radio-server = { path = "crates/server" }
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1"
# "clipboard": without it, copy buttons copy nothing to the system clipboard.
# "links": without it, nothing opens in the browser (Download and What's new in the update prompt).
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
# The emoji fonts were part of the default fonts until egui 0.37; titles and the UI use them.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
# Decoders for the cover art that egui_extras loads.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
egui_kittest = "0.37"
lucide-icons = "1.77"
# Shared egui controls of the Craft apps (MIT OR Apache-2.0). Same rev as craft-audio.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "a7f8dd621e0d95dc81fb455a35467cbd56d75e3d", default-features = false }
# How the user's region writes numbers, for the number fields (MIT OR Apache-2.0). Same rev.
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "a7f8dd621e0d95dc81fb455a35467cbd56d75e3d", default-features = false }
# The local control channel: per-launch token, loopback JSON lines (MIT OR Apache-2.0). Same rev.
craft-control = { git = "https://github.com/storytold/craft-libs", rev = "a7f8dd621e0d95dc81fb455a35467cbd56d75e3d", default-features = false }
# The MCP server machinery: JSON-RPC over stdio, tool schemas, argument checks (MIT OR Apache-2.0).
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "a7f8dd621e0d95dc81fb455a35467cbd56d75e3d", default-features = false }
# Preferences of this computer in config.toml, as every Craft app keeps them (MIT OR Apache-2.0).
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "a7f8dd621e0d95dc81fb455a35467cbd56d75e3d" }
# Keyboard bindings as the Craft apps keep them: one catalog of commands and their chords (MIT OR Apache-2.0).
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "a7f8dd621e0d95dc81fb455a35467cbd56d75e3d", default-features = false, features = ["egui", "ui"] }
# The menu bar, native on macOS and drawn in the window elsewhere, as in the Craft apps (MIT OR Apache-2.0).
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "a7f8dd621e0d95dc81fb455a35467cbd56d75e3d" }
# Update checks, the update prompt and self-update, as in the Craft apps (MIT OR Apache-2.0). Same rev.
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "a7f8dd621e0d95dc81fb455a35467cbd56d75e3d", default-features = false, features = ["egui"] }
rfd = "0.18"
radio-ui-egui = { path = "crates/ui-egui" }
radio-ui-engine = { path = "crates/ui-engine" }
# The OS keychain: macOS Keychain, Windows Credential Manager, Secret Service on Linux.
keyring = "4.2"
radio-playout = { path = "crates/playout" }
radio-testkit = { path = "crates/testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }


# storytold's forks of egui (0.37.0 plus their IME, right-to-left and font work) and of winit,
# at the revisions the Craft apps use. craft-ui needs them.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
