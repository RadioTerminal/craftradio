[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
opus = "0.3"
ogg = "0.9"
rtrb = "0.3"
base64 = "0.22"
ureq = { version = "3", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "ogg", "vorbis", "pcm", "wav"] }
rquickjs = "0.14"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
rand_chacha = "0.9"
clap = { version = "4", features = ["derive"] }
proptest = "1"
radio-model = { path = "crates/model" }
radio-testkit = { path = "crates/testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
