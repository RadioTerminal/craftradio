# mp3lame-sys 0.2.0 (https://github.com/DoumanAsh/mp3lame-sys), LGPL-3.0, with its build script
# replaced: it links the LAME shared library of the system instead of compiling LAME into the
# program, so release builds meet the LGPL relinking terms (AGENTS.md rule 12). src/lib.rs is the
# upstream file, unchanged. See README.md.
[package]
name = "mp3lame-sys"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/DoumanAsh/mp3lame-sys"
description = "Bindings to mp3lame library, linked dynamically"
license = "LGPL-3.0"
publish = false
links = "mp3lame"

[build-dependencies]
pkg-config = "0.3"
